name: Build PDF

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-luatex texlive-latex-extra texlive-bibtex-extra texlive-fonts-recommended texlive-fonts-extra texlive-lang-german texlive-lang-latin

      - name: Build PDFs
        run: make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APTH-PDFs
          path: |
            apth_declaration_de.pdf
            apth_declaration_en.pdf
            apth_declaration_la.pdf

      - name: Delete previous release
        run: gh release delete v1-2026-08-29 --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          gh release create v1-2026-08-29 \
            "apth_declaration_de.pdf#APTH-declaration-de-v1-2026-08-29.pdf" \
            "apth_declaration_en.pdf#APTH-declaration-en-v1-2026-08-29.pdf" \
            "apth_declaration_la.pdf#APTH-declaration-la-v1-2026-08-29.pdf" \
            --title "APTH v1 - 2026-08-29" \
            --notes "First release of the APTH declaration, built automatically via GitHub Actions. Includes German (de), English (en), and Latin (la) versions."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}