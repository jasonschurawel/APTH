name: Build PDF

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-luatex texlive-latex-extra texlive-bibtex-extra texlive-fonts-recommended texlive-lang-german

      - name: Build PDF
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: APTH-PDF
          path: erklärung.pdf

      - name: Delete previous release
        run: gh release delete ausgabe-1 --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: gh release create ausgabe-1 "erklärung.pdf#APTH-Ausgabe-1.pdf" --title "APTH – Ausgabe 1" --notes "Erste Ausgabe des APTH, gebaut per GitHub Actions."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}